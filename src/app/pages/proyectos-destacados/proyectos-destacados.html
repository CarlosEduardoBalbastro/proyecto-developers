<section id="proyectos" class="projects-section">
    <h2 class="section-title">Proyectos Destacados</h2>
    
    <div class="projects-grid">


        @for (proyecto of proyectos; track proyecto.id )
        {
                <article class="project-card">
                <div class="project-image">
                    <a [href]="proyecto.url" target="_blank" rel="noopener noreferrer">
                        <img [src]="proyecto.imagen" [alt]="proyecto.nombre" loading="lazy">    
                    </a>    
                </div>
                   <div class="project-content">
                <h3 class="project-name">{{proyecto.nombre}}</h3>
                
                <div class="project-tags">
                    @for (tecnologia of proyecto.tecnologias; track tecnologia)
                    {
                        <span>{{tecnologia}}</span>
                    }
                    
                    
                </div>
                
                <ul class="project-features">
                    <li>
                      {{proyecto.descripcion}}  
                    </li>
                  
              
                </ul>
                
                <a [href]="proyecto.url" target="_blank" class="btn-project">
                    Ver Sitio Web
                </a>
            </div>
            </article>

        }
        @empty
        {
            <p class="no-projects">{{mensajeNoEncontrado}}</p>
        }

     
        </div>
  
</section>
